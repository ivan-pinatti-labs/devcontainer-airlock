# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# The project is analyzed from CI with Automatic Analysis turned off in the
# project settings: the two cannot run side by side, and a CI scan aborts
# while Automatic Analysis is on.
#
# A repository created from this template needs its own SonarQube Cloud
# project and its own key below; see docs/MERGE_PIPELINE.md.
sonar.organization=ivan-pinatti-labs
sonar.projectKey=ivan-pinatti-labs_devcontainer-airlock
sonar.projectName=devcontainer-airlock

# Sources are the whole tree rather than a list of folders, so a new file is
# analyzed without anyone remembering to add it here. Sonar only reads the
# languages it has an analyzer for (shell, Python, JavaScript, the
# Dockerfiles, YAML and GitHub Actions here) plus its secrets detection,
# which runs over every text file.
#
# Test code is analyzed as such, which Sonar holds to a different rule set,
# and excluded from sources so the two sets stay disjoint: tests/, which
# `make coverage` runs, and the two test scripts the gh-broker and mirror-gate
# image builds run (images/gh-broker/test_broker.py and
# images/mirror-gate/test_gate.py), which sit next to the code they test.
#
# The rest of the exclusions are not code anyone here writes:
#   coverage/**                    the reports `make coverage` writes
#   images/base/keyrings/*.asc     third party apt signing keys
#   .secrets.baseline              generated by detect-secrets, hashes only
#   docs/architecture.svg          a drawing
#   extensions.txt, go-modules.txt, repositories.json and
#   tests/requirements.txt         pin and data lists, not code
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,**/test_*.py
sonar.exclusions=tests/**,**/test_*.py,\
  coverage/**,\
  images/base/keyrings/*.asc,\
  .secrets.baseline,\
  docs/architecture.svg,\
  images/workbench/vscode/extensions.txt,\
  images/l2/go-modules.txt,\
  images/mirror-gate/backends/nexus/repositories.json,\
  tests/requirements.txt

# Sonar picks a file's language by its extension alone, and most scripts
# here have none: they are found by their shebang, which Sonar never reads.
# These list them by path next to each language's default suffix globs, so
# they are analyzed as what they are. A new script without an extension has
# to be added to the matching list; for shell, tests/test_coverage_hook.py
# fails until every script the Makefile's rule finds is matched here.
sonar.lang.patterns.shell=**/*.sh,**/*.bash,\
  host/workbench,\
  images/egress-proxy/bin/egress-proxy,\
  images/egress-proxy/bin/egress-reload,\
  images/l2/bin/actionlint,\
  images/l2/bin/docker,\
  images/l2/engine-bin/podman,\
  images/l2-engine/containers/crun-without-masked-paths,\
  images/workbench/bin/airlock-worktree,\
  images/workbench/bin/claude,\
  images/workbench/bin/finish-image,\
  images/workbench/bin/l2,\
  images/workbench/bin/l2-hooks-install,\
  images/workbench/bin/l2-pre-commit,\
  images/workbench/bin/rec,\
  images/workbench/bin/status-line,\
  images/workbench/bin/workbench-init,\
  images/workbench/share/git-hook
sonar.lang.patterns.py=**/*.py,\
  images/egress-proxy/bin/egress-refresh,\
  images/l2/bin/l2-prepare-hooks,\
  images/mirror-gate/backends/nexus/provision,\
  images/mirror-gate/bin/mirror-gate,\
  images/workbench/bin/gh,\
  images/workbench/bin/route-to-l2
sonar.lang.patterns.js=**/*.js,**/*.jsx,**/*.cjs,**/*.mjs,**/*.vue,\
  images/workbench/bin/airlock-relay

# The Python runs on the images' system python3, which is Ubuntu 26.04's
# Python 3.14 (images/base/Dockerfile), the same version the Pre-commit job
# sets up for the hooks and the Makefile's PYTHON_IMAGE measures coverage
# with. Rules that depend on the language version judge the code against the
# interpreter it actually ships with. tests/test_python_version_pin.py fails
# when any of these drift apart.
sonar.python.version=3.14

# Written by `make coverage` (sonarqube.yml's "Measure coverage" step), never
# committed. shell.xml is kcov's report of the shell scripts in SonarQube's
# generic coverage format, since SonarQube has no shell coverage importer.
# Every report names a file by its path from the repository root, extensionless
# scripts included, which is how SonarQube matches it to a source file.
sonar.python.coverage.reportPaths=coverage/coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverageReportPaths=coverage/shell.xml

sonar.sourceEncoding=UTF-8
