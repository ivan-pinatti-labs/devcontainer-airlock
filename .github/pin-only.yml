---
# What a dependency bot may change here without a person reading the diff.
# Read by the shared `Pin Only` check in ivan-pinatti-labs/gh-actions, which
# reads it from the default branch rather than from the pull request being
# graded. This file is deliberately absent from its own allowed_paths, so a
# bot cannot widen its own lane.
#
# Reproduces the scripts/assert-pin-only-diff.py this replaced, exactly.
# Unlike every other repository here the block scalar exemption is not
# scoped to .github/workflows/: it applies on every path, which is why the
# three action grammars carry it as default_grammars rather than as a rule.

# Every image's Dockerfile, the three scripts that pin an image in a shell
# assignment: scripts/build-images.sh (a registry, trivy, skopeo),
# host/workbench (the mirror backend) and host/scrub (gitleaks), and the
# workbench's VS Code extension pins.
allowed_paths:
  - .pre-commit-config.yaml
  - .github/workflows/
  - images/base/Dockerfile
  - images/workbench/Dockerfile
  - images/l2/Dockerfile
  - images/l2-engine/Dockerfile
  - images/gh-broker/Dockerfile
  - images/egress-proxy/Dockerfile
  - images/mirror-gate/Dockerfile
  - images/podman-nested/Dockerfile
  - tests/requirements.in
  - tests/requirements.txt
  - Makefile
  - scripts/build-images.sh
  - host/workbench
  - host/scrub
  - images/workbench/vscode/extensions.txt

# The coding agent CLI versions and the agent-policy release are annotated
# ARGs in the workbench's Dockerfile; the script images are annotated shell
# assignments. Only a name an annotation on the default branch made eligible
# is graded as a pin.
arg_sources:
  - file: images/workbench/Dockerfile
    annotations:
      - '^#\s*renovate:'
  - file: scripts/build-images.sh
    annotations:
      - '^#\s*renovate:'
  - file: host/workbench
    annotations:
      - '^#\s*renovate:'
  - file: host/scrub
    annotations:
      - '^#\s*renovate:'

rules:
  # arg_tag_commit is agent-policy's `ARG AGENT_POLICY_REF=<tag>@<commit>`:
  # the tag and the commit it must resolve to move together.
  - path: "*Dockerfile"
    grammars: [docker_image_pin, arg_pin, arg_tag_commit]
  # `NAME=image:tag@sha256:<digest>`, alone on its line: only the tag and the
  # digest may move.
  - path: scripts/build-images.sh
    grammars: [shell_image_pin]
  - path: host/workbench
    grammars: [shell_image_pin]
  - path: host/scrub
    grammars: [shell_image_pin]
  # The test suite's exact pins, and the hash lock compiled from them.
  # hash_locked_requirements grades the lock as a whole: same packages, only
  # versions and hashes moved, and every new hash one PyPI publishes for that
  # release. A bump that pulls in a new package waits for a person.
  - path: tests/requirements.in
    grammars: [requirement_line]
  - path: tests/requirements.txt
    grammars: [hash_locked_requirements]
  # The images `make coverage` runs, pinned by digest; Renovate's packageRules
  # keep their tags fixed, so only the digest ever moves.
  - path: Makefile
    grammars: [digest]
  # The VS Code extensions baked into the workbench, `publisher.name@1.2.3`
  # one per line: the extension stays, only its version moves. An added or
  # removed line has no counterpart, so a new extension waits for a person.
  - path: images/workbench/vscode/extensions.txt
    grammars: [vscode_extension_pin]

# Block scalars are passed through on every path here, not only workflows.
default_grammars:
  - name: action_sha
    when: outside_block_scalar
  - name: bare_action_version
    when: outside_block_scalar
  - name: rev_pin
    when: outside_block_scalar
