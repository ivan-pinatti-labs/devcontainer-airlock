---
name: CodeRabbit Gate

# Calls the organization's shared gate, which publishes the two required
# contexts branch protection cannot decide on its own:
#
#   Pin Only        whether a dependency bot's diff changes nothing but pins
#   Review Verified whether CodeRabbit actually reviewed this head, rather
#                   than reporting green on a skip or a rate limited decline
#
# The grading code lives in ivan-pinatti-labs/gh-actions. It used to live here,
# as a 694 line scripts/assert-pin-only-diff.py and a 172 line
# scripts/coderabbit-review-verdict.py, alongside five other copies of each.
#
# Pinned by SHA, never by tag. The workflow reads its own library at that same
# commit through job.workflow_sha, so pinning this pins the code that grades
# merges here, with no second pin to drift.
#
# .github/pin-only.yml says what a bot may change here, including the
# annotated ARG names read from images/base/Dockerfile. It is read from the
# default branch, never from the pull request being graded, and is not in its
# own allowed_paths, so a bot cannot widen its own lane.

"on":
  # zizmor: ignore[dangerous-triggers]
  #
  # Never checks out the pull request. The shared workflow pins its checkout to
  # the default branch and reads the pull request only as API data.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  status:
  schedule:
    # Unchanged from this repository's own previous schedule.
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          Pull request number to re-grade. Blank re-grades every open pull
          request, which is the useful default for recovering from a missed
          schedule slot rather than diagnosing one pull request.
        required: false
        type: string
  merge_group:

permissions:
  contents: read

jobs:
  gate:
    # A pinned reusable workflow reference is one scalar: the path and the
    # 40 character SHA cannot be wrapped, and shortening either would mean
    # giving up the pin.
    # yamllint disable-line rule:line-length
    uses: ivan-pinatti-labs/gh-actions/.github/workflows/reusable-coderabbit-gate.yml@f8d1112855625a68c002edfc3bcae7d11299bc28 # v0.1.5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
