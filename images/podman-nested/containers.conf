# Per user containers.conf for the 'podman' account, installed over the base
# image's own ~/.config/containers/containers.conf.
#
# The base image bind mounts its own /proc into every nested container
# (volumes = ["/proc:/proc"]), because a fresh procfs cannot be mounted while
# the outer runtime masks parts of /proc. That hands every nested container
# the outer PID namespace's /proc, so a program that reads /proc/self/exe
# finds a process that is not itself and fails. This image is run with
# --security-opt unmask=ALL (docs/IMAGES.md, "The nested test runner"), so a
# fresh procfs mounts and the bind mount is dropped here.
#
# default_sysctls stays empty, as the base image has it: its default entries
# are network namespace settings, and a nested container on the default
# (host) network has no namespace of its own to set them in.
[containers]
default_sysctls = []
