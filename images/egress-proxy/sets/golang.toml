description = "Go modules from the network: the module proxy, the checksum database, and storage.googleapis.com, where the proxy hands its downloads off to. That last one is broad (every Cloud Storage bucket, not only the proxy's), and there is no narrower way in: fetching modules from their own repositories instead fails verification for some of them (measured 2026-09-25: gitleaks v8.30.1). Golang hooks do not need it, since L2 serves their modules offline (images/l2/go-modules.txt). Select it only to build Go against the network, such as building the L2 image itself. vuln.go.dev is the Go vulnerability database, the default for govulncheck."
domains = ["proxy.golang.org", "sum.golang.org", "storage.googleapis.com", "vuln.go.dev"]
