# The egress proxy's fixed configuration. The allow rules themselves are
# generated by egress-refresh, into /run/egress/sets.conf, from the
# workspaces the host registered and the egress sets each one selected
# (docs/LAYERS.md, "Network"). Each rule names the workspace's subnet, so
# nothing that is not on a workspace network is let through, whatever it
# reaches port 8888 from.
http_port 8888
pid_filename /run/squid/squid.pid
coredump_dir /tmp
# No caching and small lookup tables: this proxy only decides and forwards.
# Measured 2026-09-25 with seven sets and every AWS range loaded: 89 MB
# resident with squid's defaults, 13 MB with these.
cache deny all
cache_mem 0 MB
memory_pools off
ipcache_size 512
fqdncache_size 128
client_db off
max_filedescriptors 1024
pinger_enable off
# Stop at once when the container is stopped, instead of waiting 30 seconds
# for open tunnels to finish.
shutdown_lifetime 1 seconds
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
# Names the requests carried, so a refusal in the log says which host it was.
strip_query_terms on

acl CONNECT method CONNECT
acl tls_port port 443
acl plain_port port 80

# TLS tunnels only to 443; plain requests (apt) only to 80.
http_access deny CONNECT !tls_port
http_access deny !CONNECT !plain_port

include /run/egress/sets.conf

http_access deny all
