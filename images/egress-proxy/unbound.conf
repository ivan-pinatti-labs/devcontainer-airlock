# The egress proxy's own resolver: everything in this container (squid,
# egress-refresh) resolves through it, and it answers only on loopback, so
# no workspace can reach it.
#
# It caches and DNSSEC validates, and sends every query it cannot answer to
# Cloudflare's security resolvers (1.1.1.2 and 1.0.0.2, which also refuse
# known malware domains), encrypted, with the certificate checked against
# their name, so nothing on the way can read or change a query or an
# answer. How is EGRESS_DNS's choice: DNS over HTTPS (doh, the default)
# through dnscrypt-proxy on loopback, or DNS over TLS (dot) from unbound
# itself, on port 853. egress-proxy writes that forward zone into
# /run/egress/forward.conf at start. Plain DNS leaves this container for
# nothing.
server:
  interface: 127.0.0.1
  port: 53
  do-ip6: no
  # Rootless, as the container's own account: no chroot, no user switch.
  username: ""
  chroot: ""
  directory: "/run/egress"
  pidfile: "/run/egress/unbound.pid"
  use-syslog: no
  logfile: ""
  verbosity: 0
  access-control: 127.0.0.0/8 allow
  access-control: 0.0.0.0/0 refuse
  # The doh forwarder is on loopback, which unbound otherwise never asks.
  do-not-query-localhost: no
  # For dot: the resolvers' certificate is checked against the system CAs.
  tls-system-cert: yes
  # DNSSEC, against the root key Ubuntu's dns-root-data ships (the nightly
  # rebuild picks up a new one).
  trust-anchor-file: "/usr/share/dns/root.key"
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-referral-path: yes
  harden-below-nxdomain: yes
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  aggressive-nsec: yes
  prefetch: yes
  # Answers that point into private ranges are refused: a public name must
  # not resolve to a workspace network or the host's LAN.
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: 127.0.0.0/8

include: "/run/egress/forward.conf"
